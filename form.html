<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Survey Questionnaire</title>
  </head>
  <body>
    <div class="heading">
      <h1><b>Travel Survey Questionnaire</b></h1>
      <h4>
        Please complete the following questionnaire as accurately as possible
        and then return to [XYZ Travel Agency]
      </h4>
    </div>
    <div class="contact_information">
        <p>1. Contact Information</p>
        <label for="fname">First Name: </label>
        <input type="text" id="fname" placeholder="Juan" required>
        <label for="mname">Middle Name: </label>
        <input type="text" id="mname" placeholder="Marcos" required>
        <label for="lname">Last Name: </label>
        <input type="text" id="lname" placeholder="de la Cruz" required>
        <label for="title">Title: </label>
        <input type="text" id="title" placeholder="Jr/Sr/III" required>
        <label for="phone">Phone: </label>
        <input type="text" id="phone" placeholder="09XXXXXXXXX" required>
        <label for="fax">Fax: </label>
        <input type="text" id="fax" placeholder="XXXXXX" required>
        <label for="email">Email: </label>
        <input type="text" id="email" placeholder="abc@abc.com" required>
        <label for="address">Address: </label>
        <input type="text" id="address" placeholder="" required>
    </div>
    <div class="travelnext">
        <p>2. When do you plan to travel next?</p>
        <label><input type="radio" name="travelplan" value="1-3 months" onchange="travelplan = this.value"> 1-3 months</label>
        <label><input type="radio" name="travelplan" value="3-6 months" onchange="travelplan = this.value"> 3-6 months</label>
        <label><input type="radio" name="travelplan" value="6-12 months" onchange="travelplan = this.value"> 6-12 months</label>
        <label><input type="radio" name="travelplan" value="more than a year" onchange="travelplan = this.value"> More than a year</label>
    </div>
  </body>
</html>
